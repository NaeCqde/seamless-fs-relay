#:schema node_modules/wrangler/config-schema.json
name = "seamless-fs-relay"
main = "src/index.ts"
compatibility_date = "2024-12-24"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[[kv_namespaces]]
binding = "KV"
id = ""

[vars]
# The address of every server and the SHA-256 of its token (`sfs token` prints both):
#   SERVERS = '{"https://a.example.com": "<64 hex digits>", "https://b.example.com": "<64 hex digits>"}'
# A hash is not a secret as long as the token is a long random one (`sfs token`).
SERVERS = '{}'
# The public key of the relay (`sfs keygen`). The private key is a secret: `wrangler secret put RELAY_PRIVATE_KEY`.
RELAY_PUBLIC_KEY = ""
